plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing credentials. Never committed — see android/.gitignore.
// Without this file the release build falls back to the debug key, which Play
// rejects; see plans/store-release-plan.md §2 (blocker B3).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
    hasReleaseKeystore = file(keystoreProperties['storeFile']).exists()
}

android {
    namespace "com.lzizka.songsviewer.songs_viewer_bloc"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // Two products from one codebase — see plans/store-release-plan.md §10.
    // Different application IDs mean both can be installed side by side on the
    // same device, so the store build can be tested next to the personal one.
    flavorDimensions "product"

    productFlavors {
        personal {
            dimension "product"
            // Deliberately kept at the original application ID so existing
            // installations (and their local Hive data) survive this split.
            applicationId "com.lzizka.songsviewer.songs_viewer_bloc"
            manifestPlaceholders = [appName: "Songs Viewer Dev"]
        }
        store {
            dimension "product"
            // Clean, permanent ID for the published app. This cannot be changed
            // after the first release — see §2 (blocker B4).
            applicationId "com.lzizka.songviewer"
            manifestPlaceholders = [appName: "Songs Viewer"]
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // Keeps `flutter run --release` working locally. A build signed
                // this way must never be uploaded to Play.
                logger.warn("WARNING: android/key.properties or the keystore is missing — " +
                            "signing the release build with DEBUG keys. Do not upload this artifact.")
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
