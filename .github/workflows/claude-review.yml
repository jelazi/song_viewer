name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is already checked out in the current working directory.
            Read the PR with `gh pr view` and its changes with `gh pr diff`.
            Read AGENTS.md, docs/TODO.md and the first 150 lines of DEVLOG.md (newest entries are first).

            Review the pull request and answer three questions:
            1. Does the change do what the PR description says?
            2. Can it break existing behaviour?
            3. Does it fit the project's rules and direction?

            Report only concrete findings with file and line, and say why each one matters.
            Clearly mark anything you could not verify. Do not change any code.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific code issues.
            Use `gh pr comment` for a short summary that answers the three questions.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
