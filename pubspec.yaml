  easy_localization: ^3.0.1

  share_plus: ^12.0.1
  file_picker: ^10.1.0
  hive_generator: ^2.0.0
  collection: ^1.17.1
  pdf: ^3.10.4
  material_design_icons_flutter: ^7.0.7296
  split_view: ^3.2.1
  numberpicker: ^2.1.2
  flutter_colorpicker: ^1.0.3
  flutter_launcher_icons: ^0.14.1
  logger_pkg:
    path: ../logger
  window_manager: ^0.5.1
