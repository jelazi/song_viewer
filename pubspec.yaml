  qr_flutter: ^4.1.0
  pocketbase: ^0.23.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.13
  json_annotation: ^4.8.0
  json_serializable: ^6.6.1
  patrol: ^4.1.1

  flutter_lints: ^6.0.0
  mockito: ^5.4.4

flutter:
