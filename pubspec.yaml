dependencies:
  path: any
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  equatable: ^2.0.5
  flutter_bloc: ^9.0.0
  path_provider: ^2.1.5
  uuid: ^4.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  easy_localization: ^3.0.1

  share_plus: ^10.1.3
  file_picker: ^9.0.0
  firedart: ^0.9.0+1
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.0
  firebase_database: ^11.1.1
  hive_generator: ^2.0.0
  collection: ^1.17.1
  pdf: ^3.10.4
  material_design_icons_flutter: ^7.0.7296
  split_view: ^3.2.1
  numberpicker: ^2.1.2
  flutter_colorpicker: ^1.0.3
  flutter_launcher_icons: ^0.14.1
  logger_pkg:
    path: ../../logger
  window_manager: ^0.4.2
